repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: bandit
        language: system
        types: [python]
        args: [--configfile, pyproject.toml]
        exclude: ^(tests/|migrations/|django_service)
        pass_filenames: true
        stages: [pre-push]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: [--config-file=pyproject.toml]
        exclude: ^(tests/|migrations/|docs/)
        require_serial: true

      - id: django-check
        name: Django Check
        entry: python manage.py check
        language: system
        pass_filenames: false
        files: \.py$

      # Uses the repo's own eslint rather than a mirror hook so the version and
      # plugins always match frontend/package.json. Only the staged files are
      # linted; ESLint resolves frontend/eslint.config.js by walking up from
      # each file, so running from the repo root is fine.
      - id: eslint
        name: eslint
        entry: frontend/node_modules/.bin/eslint
        language: system
        files: ^frontend/.*\.(js|jsx)$
        exclude: ^frontend/(dist|htmlcov|coverage|node_modules)/
        pass_filenames: true

      - id: pytest-with-coverage
        name: Tests with Coverage
        entry: pytest
        language: system
        args: [--cov=django_email_learning, --cov-fail-under=80, tests/]
        pass_filenames: false
        files: \.py$
        stages: [pre-push]
