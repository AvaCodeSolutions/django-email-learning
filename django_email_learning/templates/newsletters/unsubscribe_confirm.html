{% extends "public/base.html" %}
{% load i18n %}

{% block title %}{% translate "Confirm Unsubscribe" %}{% endblock %}

{% block body %}
<div style="font-family: Helvetica, Arial, sans-serif; max-width: 520px; margin: 80px auto; padding: 0 20px; text-align: center;">
    <h1 style="font-size: 24px; color: #1f2340; margin-bottom: 16px;">{% translate "Confirm unsubscribe" %}</h1>
    <p style="font-size: 15px; color: #555; line-height: 1.7;">
        {% blocktranslate %}Are you sure you want to unsubscribe from <strong>{{ newsletter_title }}</strong>?{% endblocktranslate %}
    </p>
    <form method="post">
        <button type="submit" style="background: #1f2340; color: white; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer;">
            {% translate "Unsubscribe" %}
        </button>
    </form>
</div>
{% endblock %}
