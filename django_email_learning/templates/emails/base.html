{% load i18n %}
{% with brand_color="#636eec" %}
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            .color-brand {
                color: {{ brand_color }};
            }
            .bg-brand {
                background-color: {{ brand_color }};
                color: #fff !important;
            }
            .border-brand {
                border-color: {{ brand_color }};
            }
            .background {
                width: 100%;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                line-height: 1.8;
                font-size: 15px;
                color: #333;
                background-color: #f9f9f9;
            }

            .locale {
                {% get_current_language_bidi as IS_RTL %}
                {% if IS_RTL %}
                    direction: rtl;
                    text-align: right;
                {% else %}
                    direction: ltr;
                    text-align: left;
                {% endif %}
            }

            @media screen and (max-width: 480px) {
                .mobile-content {
                    width: 100% !important;
                    padding: 10px !important;
                }
            }

            @media screen and (min-width: 481px) and (max-width: 850px) {
                .mobile-content {
                    padding: 10px !important;
                    width: 100% !important;
                }
            }
            @media screen and (min-width: 851px) {
                .background {
                    padding: 10px !important;
                }
                .mobile-content {
                    width: 800px !important;
                    max-width: 800px !important;
                    margin: 20px auto;
                    padding: 20px !important;
                    border-radius: 8px;
                    border: 1px solid #e0e0e0;
                }
                h2 {
                    padding: 20px 0;
                }
            }
            img {
                max-width: 100%;
                height: auto;
                border-radius: 10px;
            }
            blockquote {
                {% if IS_RTL %}
                    border-right: 4px solid #e0e0e0;
                    border-left: none;
                {% else %}
                    border-left: 4px solid #e0e0e0;
                    border-right: none;
                {% endif %}
                margin: 0px !important;
                padding: 0 16px;
            }
            .email-title {
                color: #2c3e50;
                margin: 0 0 20px;
                text-align: center;
                border-bottom: 2px solid {{ brand_color }};
                padding-bottom: 12px;
                line-height: 1.35;
                font-size: 24px;
            }
            .email-subtitle {
                margin: 20px 0 10px;
                color: #2c3e50;
                font-size: 18px;
            }
            .email-paragraph {
                font-size: 15px;
                margin: 0 0 16px;
            }
            .email-cover-wrap {
                margin: 0 0 20px;
            }
            .email-cover {
                width: 100%;
                max-width: 100%;
                height: auto;
                display: block;
                border-radius: 6px;
            }
            .email-cta-wrap {
                text-align: center;
                margin: 24px 0;
            }
            .email-cta {
                display: inline-block;
                color: #1f2340;
                padding: 12px 24px;
                text-decoration: none;
                border-radius: 5px;
                font-weight: 400;
                font-size: 15px;
                border: 1px solid rgba(31, 35, 64, 0.18);
            }
            .email-panel {
                background-color: #f8f9fa;
                padding: 20px;
                border-radius: 5px;
                margin: 24px 0;
            }
            .email-panel.border-brand {
                border-left: 4px solid;
            }
            .email-code-box {
                background-color: #ffffff;
                padding: 15px;
                border-radius: 4px;
                border: 1px dashed #6c757d;
                text-align: center;
            }
            .email-divider-note {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #e9ecef;
                font-size: 14px;
                color: #6c757d;
            }
            .email-muted-note {
                font-size: 14px;
                color: #7f8c8d;
                text-align: center;
                margin-top: 30px;
            }
            .email-signoff {
                margin-top: 24px;
            }
            .email-signoff.centered {
                text-align: center;
            }
            .email-org-name {
                font-weight: bold;
                color: #2c3e50;
                font-size: 18px;
                margin: 0;
            }
            .email-list {
                margin: 0 0 16px;
                padding-left: 20px;
                font-size: 15px;
            }
            .email-list li {
                margin-bottom: 6px;
            }
            {% block extra_styles %}{% endblock %}
        </style>
    </head>
<body>
    <div class="background">
        <div class="mobile-content locale" style="background-color: #ffffff">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
{% endwith %}
