{% load i18n %}
{% with brand_color="#636eec" %}
<!doctype html>
<html amp4email data-css-strict>
    <head>
        <meta charset="utf-8">
        <script async src="https://cdn.ampproject.org/v0.js"></script>
        {% block extra_head %}{% endblock %}
        <style amp4email-boilerplate>body{visibility:hidden}</style>
        <style amp-custom>
            .background {
                padding: 10px;
                width: 100%;
                box-sizing: border-box;
                font-family: Helvetica, Arial, sans-serif;
                line-height: 1.8;
                font-size: 15px;
            }
            .paper {
                margin: 10px;
                padding: 8px;
                border-radius: 8px;
                border: solid 1px #eee;
            }
            .button {
                min-width: 140px;
                padding: 10px 24px;
                border: none;
                border-radius: 8px;
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                background-color: {{ button_color|default:"#4A5EC0" }};
                color: {{ button_text_color|default:"#ffffff" }};
            }
            .button:hover {
                cursor: pointer;
            }
            .email-title {
                margin: 10px;
                text-align: center;
                border-bottom: 2px solid #d8d9ee;
                padding-bottom: 10px;
                line-height: 1.35;
                font-size: 19px;
            }
            .locale {
                {% get_current_language_bidi as IS_RTL %}
                {% if IS_RTL %}
                    direction: rtl;
                    text-align: right;
                {% else %}
                    direction: ltr;
                    text-align: left;
                {% endif %}
            }
            p {
                padding: 0 15px;
            }
            /* A submitted form's result fades in. amp-form only shows [submit-success] by
               flipping display, which cannot transition, so the fade runs on a wrapper that
               is always rendered and gains .result-fade-in once the result is in place.
               Opacity only: a transform would move the result onto its own compositing
               layer, which mobile webviews are prone to mishandle touch scrolling over. */
            .result-fade {
                opacity: 0;
            }
            .result-fade-in {
                opacity: 1;
                transition: opacity 0.3s ease-out;
            }
            /* After a submit, focus moves to the result (and back to the questions on
               "Try again"), so it never stays on a button that has just been hidden -
               which mobile webviews can mishandle as touches until focus moves on. These
               boxes are not interactive, so they need no focus ring. */
            .result-fade:focus,
            .focus-target:focus {
                outline: none;
            }
            .result-illustration {
                margin: 12px 0 4px;
                text-align: center;
            }
            .result-message {
                text-align: center;
            }
            {% block extra_styles %}{% endblock %}
        </style>
    </head>
<body>
    <div class="background">
        <div class="locale">
            {% block content %}{% endblock %}
        </div>
        {% block footer %}{% endblock %}
    </div>
</body>
</html>
{% endwith %}
